name: FMC-Lobby
version: '${project.version}'
main: de.fmc.lobby.FMCLobby
api-version: '1.21'
author: FARMMC.DE
description: Lobby-System für FARMMC.DE (Teleporter, Schutz, Partikel, Enterhaken, Baublöcke, Scoreboard, Tablist)
website: https://farmmc.de
softdepend:
  - PlaceholderAPI
  - LuckPerms

commands:
  lobby:
    description: Verwaltung der Lobby
    usage: /lobby <reload|setspawn|build>
    permission: lobby.command
  globalmute:
    description: Schaltet den Chat für alle Spieler ab oder wieder an
    usage: /globalmute
    permission: lobby.globalmute

permissions:
  lobby.globalmute:
    description: /globalmute benutzen
    default: op
  lobby.globalmute.bypass:
    description: Trotz Globalmute schreiben
    default: op
  lobby.chat.color:
    description: Farbcodes (&a, &l …) im Chat nutzen
    default: op
  lobby.command:
    description: Zugriff auf /lobby
    default: true
  lobby.admin:
    description: /lobby setspawn und /lobby reload
    default: op
  lobby.build:
    description: /lobby build (Baumodus, Schutz für sich selbst abschalten)
    default: op
