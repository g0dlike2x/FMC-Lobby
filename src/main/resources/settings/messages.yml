# ╔══════════════════════════════════════════════════════════════╗
# ║                FMC-Lobby  ·  messages.yml                    ║
# ║  %prefix% wird durch messages.prefix ersetzt.                ║
# ║  %nl% = Zeilenumbruch                                         ║
# ╚══════════════════════════════════════════════════════════════╝

messages:
  prefix: '&8┃ &x&A&2&3&5&F&F&lLOBBY &8» &7'

  # Willkommensnachricht (5 Ticks nach dem Join). Platzhalter: %player%
  # Die erste Zeile leert den Chat (23× %nl%).
  welcome:
    - '%nl%%nl%%nl%%nl%%nl%%nl%%nl%%nl%%nl%%nl%%nl%%nl%%nl%%nl%%nl%%nl%%nl%%nl%%nl%%nl%%nl%%nl%%nl%'
    - '&8┃ &x&A&2&3&5&F&F&l❤ &8» &7Willkommen in der Lobby von &x&9&8&3&3&F&F&lF&x&A&2&3&5&F&F&lA&x&A&C&3&7&F&F&lR&x&A&2&3&5&F&F&lM&x&9&8&3&3&F&F&lM&x&A&2&3&5&F&F&lC&8.&x&A&2&3&5&F&F&lD&x&9&8&3&3&F&F&lE&7, &a%player%&7.'
    - '&8┃ &x&A&2&3&5&F&F&l❤ &8» &7Nutze den &eTeleporter&7, um auf &aCityBuild &7zu gelangen.'
    - '&8┃ &x&A&2&3&5&F&F&l❤ &8» &7Discord&8: &8/&9discord'
    - '&8┃ &x&A&2&3&5&F&F&l❤ &8» &7Shop&8: &8/&6buy'
    - '&3'

  general:
    no-permission: '%prefix%&cDazu hast du keine Berechtigung.'
    player-only: '%prefix%&cDieser Befehl ist nur für Spieler.'
    usage: '%prefix%&7Benutzung&8: &e/lobby &8<&ereload&8|&esetspawn&8|&ebuild&8>'

  command:
    reload-success: '%prefix%&7Die Konfiguration wurde &aneu geladen&7. &8(&e%time% ms&8)'
    reload-failed: '%prefix%&cFehler beim Neuladen. Details stehen in der Konsole.'
    setspawn-success: '%prefix%&7Der Spawn wurde &agesetzt&7.'
    build-enabled: '%prefix%&7Baumodus &aaktiviert&7. Der Lobby-Schutz ist für dich aus.'
    build-disabled: '%prefix%&7Baumodus &cdeaktiviert&7. Der Lobby-Schutz ist wieder aktiv.'

  # /discord und /buy – jede Zeile ist anklickbar und öffnet die URL aus config.yml (links.*)
  links:
    hover: '&7Klicke, um den Link zu öffnen'
    discord:
      - '%prefix%&7Unser Discord&8: &9discord.gg/farmmc'
      - '%prefix%&7Klicke auf die Nachricht, um beizutreten.'
    buy:
      - '%prefix%&7Unser Shop&8: &6shop.farmmc.de'
      - '%prefix%&7Klicke auf die Nachricht, um den Shop zu öffnen.'

  chat:
    muted: '%prefix%&cDer Chat ist aktuell deaktiviert.'
    # Broadcast an alle. Platzhalter: %player%
    globalmute-enabled: '%prefix%&7Der Chat wurde von &c%player% &cdeaktiviert&7.'
    globalmute-disabled: '%prefix%&7Der Chat wurde von &a%player% &awieder aktiviert&7.'

  gui:
    back: '&c<- Zurück zum Menü'
    previous-page: '&a<- Vorherige Seite'
    next-page: '&aNächste Seite ->'
    page-lore: '&7Seite&8: &e%page%&8/&e%pages%'

  teleporter:
    status-online: '&a✔ Online'
    status-offline: '&c✖ Neustart läuft'
    offline: '%prefix%&a%server% &7startet gerade neu. Bitte warte einen Moment.'
    connecting: '%prefix%&7Du wirst mit &a%server% &7verbunden&8...'
    # ActionBar
    cooldown: '&cBitte warte einen Moment.'
    # Klick-Hinweis in der Lore (%action%)
    action-connect: '&bKlicke hier, um %server% zu betreten.'
    action-queue-join: '&bKlicke hier, um der Warteschlange beizutreten.'
    action-queue-leave: '&bKlicke hier, um die Warteschlange zu verlassen.'
    # Warteschlange. Platzhalter: %server%, %position%
    queue-joined: '%prefix%&7Du bist in der Warteschlange für &a%server% &8(&7Platz &e%position%&8)&7. Sobald der Server online ist, wirst du automatisch verbunden.'
    queue-left: '%prefix%&7Du hast die Warteschlange für &a%server% &cverlassen&7.'
    queue-connecting: '%prefix%&a%server% &7ist wieder online. Du wirst verbunden&8...'
    # ActionBar für Wartende (jede Sekunde). Platzhalter: %server%, %position%, %size%
    queue-actionbar: '&7Warteschlange &a%server%&8: &7Platz &e%position%&8/&e%size%'
    # Chat-Hinweis an alle, die nicht warten
    back-online: '%prefix%&a%server% &7ist wieder online. Nutze den &eTeleporter&7, um beizutreten.'
    # BossBar. Platzhalter: %server%, %time% (offline seit), %queue%
    bossbar-offline: '&c✖ &a%server% &7startet neu&8… &7offline seit &e%time%'
    bossbar-online: '&a✔ %server% &7ist wieder online&8, &7du wirst verbunden&8… &8(&e%queue% &7wartend&8)'

  particles:
    selected: '%prefix%&7Du hast den Partikel &a%particle% &7ausgewählt.'
    removed: '%prefix%&7Dein Partikel wurde &centfernt&7.'
    none: '%prefix%&cDu hast keinen Partikel ausgewählt.'
    state-selected: '&a✔ Ausgewählt'
    state-available: '&e✦ Verfügbar'
    action-select: '&bKlicke hier, um den Partikel auszuwählen.'
    action-deselect: '&bKlicke hier, um den Partikel abzulegen.'
    # Lore aller Partikel-Einträge. Platzhalter: %shape%, %state%, %action%
    lore:
      - ''
      - '&7Form&8: &e%shape%'
      - '&7Status&8: %state%'
      - ''
      - '%action%'
    remove-name: '&c&lPartikel entfernen'
    remove-lore:
      - ''
      - '&7Aktuell&8: &e%current%'
      - ''
      - '&bKlicke hier, um deinen Partikel zu entfernen.'
    none-name: 'Keiner'
    shapes:
      RING: 'Ring'
      HELIX: 'Spirale'
      HALO: 'Heiligenschein'
      FEET: 'Füße'

  # ActionBar
  grapple:
    cooldown: '&7Enterhaken bereit in &e%time%s'

  # ActionBar
  build-blocks:
    limit: '&cDu hast bereits &e%limit% &cBlöcke platziert.'
    too-close: '&cHier darfst du nicht bauen.'
    height: '&cIn dieser Höhe darfst du nicht bauen.'
